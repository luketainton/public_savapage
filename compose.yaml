services:
  app:
    image: git.tainton.uk/public/savapage:latest
    restart: unless-stopped
    environment:
      - "SAVAPAGE_HTTP_PORT=8631"
      - "SAVAPAGE_HTTPS_PORT=8632"
      - "SAVAPAGE_RAW_PORT=9100"
      - "CUPS_PORT=631"
      - "SAVAPAGE_NS=SP_"
      - "SP_CONTAINER=DOCKER"
      - "SP_SRV_01=visitor.organization:Example Organisation"
      - "SP_SRV_02=server.port:8631"
      - "SP_SRV_03=server.ssl.port:8632"
      - "SP_SRV_11=database.type:PostgreSQL"
      - "SP_SRV_12=database.driver:org.postgresql.Driver"
      - "SP_SRV_13=database.url:jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      - "SP_SRV_14=database.user:${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      - "SP_SRV_15=database.password:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "${SAVAPAGE_HTTP_PORT:-8631}:8631"
      - "${SAVAPAGE_HTTPS_PORT:-8632}:8632"
      - "${SAVAPAGE_RAW_PORT:-9100}:9100"
      - "${CUPS_PORT:-631}:631"
    volumes:
      - "./savapage/custom:/opt/savapage/server/custom"
      - "./savapage/data:/opt/savapage/server/data"
      - "./savapage/ext:/opt/savapage/server/ext"
      - "./savapage/logs:/opt/savapage/server/logs"
      - "./savapage/cups:/etc/cups"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      - "POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      - "POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - "./db:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
